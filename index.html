<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pendaftaran Ekstrakurikuler</title>
</head>

<body>

    <div class="container">

        <h1>Form Pendaftaran Eskul SMK Letris Pamulang</h1>

        <form id="formPendaftaran">

            <label for="name">Nama Lengkap</label>
            <input 
                type="text" 
                id="name" 
                placeholder="Masukkan Nama Lengkap"
            >

            <label>Kelas:</label>

            <div class="radio-group">
                <label><input type="radio" name="kelas" value="X">X</label>
                <label><input type="radio" name="kelas" value="XI">XI</label>
                <label><input type="radio" name="kelas" value="XII">XII</label>
            </div>

            <label for="jurusan">Jurusan:</label>
            <select id="jurusan">
                <option value="pilihan">--Pilih Jurusan--</option>
                <option value="PPLG">PPLG</option>
                <option value="DKV">DKV</option>
                <option value="TJKT">TJKT</option>
                <option value="AKL">AKL</option>
                <option value="BDP">BDP</option>
                <option value="MPLB">MPLB</option>
            </select>

            <label for="eskul">Pilihan Eskul:</label>
            <select id="eskul">
                <option value="pilihan">--Pilih Ekstrakurikuler--</option>
                <option value="Animasi">Animasi</option>
                <option value="Paskibra">Paskibra</option>
                <option value="Volly">Volly</option>
                <option value="Basket">Basket</option>
                <option value="Futsal">Futsal</option>
                <option value="Letsin">Letsin</option>
                <option value="PMR">PMR</option>
                <option value="Dance Modern">Dance Modern</option>
            </select>

            <button type="submit" id="btnTambah">Tambah Data</button>
        </form>

        <h2>Data Pendaftaran Siswa</h2>
        <div class="table">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Jurusan</th>
                        <th>Eskul</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="dataSiswa"></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
